<ng-template #formView>
  <ng-container *ngIf="addMealFlag">
    <app-add-meal (formSubmitted)="handleFormSubmission()"></app-add-meal>
  </ng-container>
  <ng-container *ngIf="editMealFlag">
    <app-edit-meal (formSubmitted)="handleFormSubmission()"></app-edit-meal>
  </ng-container>
</ng-template>


<mat-card *ngIf="!addMealFlag && !editMealFlag; else formView">
  <mat-card-header>
    <mat-card-title>Meals for {{ todaysDate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <app-loading-component [loading]="loading"></app-loading-component>

    <button (click)="addMeal()" class="btn btn-primary">Add Meal</button>

    <mat-list *ngIf="meals.length > 0 && !loading">
      <mat-card *ngFor="let meal of meals" class="meal-card">
        <mat-card-title>{{ meal.name }}</mat-card-title>
        <mat-card-content>
          Calories: {{ meal.calories }} kcal
        </mat-card-content>
        <mat-card-actions>
          <button (click)="editMeal(meal._id)" class="btn btn-secondary">Edit</button>
          <button (click)="deleteMeal(meal._id)" class="btn btn-danger">Delete</button>
        </mat-card-actions>
      </mat-card>
    </mat-list>
  </mat-card-content>
  <mat-card-actions>
    <button (click)="addMeal()" class="btn btn-primary">Add Meal</button>
  </mat-card-actions>
</mat-card>

<mat-card>
    <mat-card-header>
        <mat-card-title>{{ itemMacros?.itemName }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <p>Calories: {{ itemMacros?.calories }}</p>
        <p>Portion Size: {{ itemMacros?.portionSize_g }} g</p>
    </mat-card-content>
    <mat-card-actions>
        <button mat-button (click)="deleteItem()">Delete</button>
    </mat-card-actions>
</mat-card>

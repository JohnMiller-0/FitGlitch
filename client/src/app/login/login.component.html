<mat-card>
  <mat-card-title>
    Login
  </mat-card-title>
  <mat-card-content>
    Please enter your login credentials.
    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="Enter email address">
      <mat-error *ngIf="submitted && f['email'].errors?.['required']">
        Email is required.
      </mat-error>
      <mat-error *ngIf="submitted && f['email'].errors?.['email']">
        Invalid email format.
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="fill">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" placeholder="Enter password">
      <mat-error *ngIf="submitted && f['password'].errors?.['required']">
        Password is required.
      </mat-error>
      <mat-error *ngIf="submitted && f['password'].errors?.['minlength']">
        Password must be at least 6 characters.
      </mat-error>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" type="submit">Login</button>
    <button mat-button color="accent" type="button" (click)="onRegisterSubmit()">Don't have an account? Register</button>
  </mat-card-actions>
</mat-card>
